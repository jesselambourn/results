<title>Vic Results Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a tally-room board. Sticky control strip, then a row of dials, then dense sortable tables. */
:root {
  --bg: #f3f4f7; --panel: #ffffff; --ink: #141a22; --muted: #5a6472; --line: #dde1e8; --track: #e6e9ef;
  --accent: #8e1538; --count: #47566b;
  --p-socialists: #8e1538; --p-labor: #dc3a2f; --p-liberal: #1f62c4; --p-greens: #2a8f43;
  --p-nationals: #b78a05; --p-oneNation: #e27a0a; --p-ind: #1f8f8f; --p-other: #8b93a1;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1217; --panel: #181c23; --ink: #e9ecf1; --muted: #9aa4b2; --line: #2b313c; --track: #262c36;
  --accent: #e8739a; --count: #9fb0c6;
  --p-socialists: #e8739a; --p-labor: #f2675c; --p-liberal: #6199ec; --p-greens: #55bb6c;
  --p-nationals: #d9ad2b; --p-oneNation: #f39a3d; --p-ind: #4fbcbc; --p-other: #8d96a5; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1217; --panel: #181c23; --ink: #e9ecf1; --muted: #9aa4b2; --line: #2b313c; --track: #262c36;
  --accent: #e8739a; --count: #9fb0c6;
  --p-socialists: #e8739a; --p-labor: #f2675c; --p-liberal: #6199ec; --p-greens: #55bb6c;
  --p-nationals: #d9ad2b; --p-oneNation: #f39a3d; --p-ind: #4fbcbc; --p-other: #8d96a5; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--panel); border-bottom: 1px solid var(--line) }
header.top .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 10px }
h1 { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 20px; letter-spacing: .01em; margin: 0; text-transform: uppercase }
h2 { font-family: var(--display); font-stretch: 85%; font-weight: 700; font-size: 26px; margin: 0; text-wrap: balance }
h3 { font-family: var(--display); font-stretch: 85%; font-weight: 700; font-size: 16px; margin: 0; text-transform: uppercase; letter-spacing: .04em }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; min-width: 0; max-width: 100% }
label.ctl { min-width: 0; max-width: 100% }
select, input[type=search], button.seg { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; min-width: 0 }
select { max-width: min(100%, 15em) }
select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible, th:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
label.ctl { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); padding-block: 8px }
.pill { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); background: var(--panel) }
.pill.warn { border-color: var(--p-oneNation) }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px }
nav.tabs a { padding: 8px 12px; color: var(--muted); text-decoration: none; font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px }
nav.tabs a.on { color: var(--ink); border-bottom-color: var(--accent) }
a { color: inherit }
a.lnk { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px }
a.lnk:hover { text-decoration-color: var(--accent) }
.crumbs { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px }
.head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin: 6px 0 14px }
.head .sub { color: var(--muted) }
main { display: flex; flex-direction: column; gap: 22px; padding-block: 4px 48px }
section { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.sec-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between }
.note { color: var(--muted); font-size: 12px; max-width: 75ch }
.dials { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px }
.dial { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px 8px; display: flex; flex-direction: column; align-items: center; min-width: 0 }
.dial svg { width: 100%; max-width: 220px; height: auto; display: block }
.dial .t { font-weight: 600; font-size: 12.5px; text-align: center; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 2.6em; line-height: 1.25 }
.dial .s { font-size: 11px; color: var(--muted); text-align: center; min-height: 1.4em }
.gv { font-family: var(--display); font-stretch: 80%; font-weight: 700; font-size: 26px; fill: var(--ink) }
.gu { font-family: var(--body); font-size: 11px; fill: var(--muted) }
.gt { font-family: var(--body); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums }
.tw { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line) }
tr:last-child td { border-bottom: 0 }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel) }
th.l, td.l { text-align: left }
th .ar { opacity: .9; margin-left: 3px }
td.name { font-weight: 600 }
td.wrapc { white-space: normal; min-width: 12em }
tr.wait td { color: var(--muted) }
tbody tr:hover td { background: color-mix(in srgb, var(--track) 45%, transparent) }
.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 22em; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block }
.bar { display: inline-block; height: 10px; border-radius: 0 3px 3px 0; vertical-align: middle; min-width: 1px }
.barc { width: 120px; text-align: left }
.swc { display: inline-block; width: 90px; height: 12px; position: relative; vertical-align: middle; background: linear-gradient(var(--line), var(--line)) 50% 0 / 1px 100% no-repeat }
.swc i { position: absolute; top: 1px; height: 10px; border-radius: 2px }
.num { font-weight: 600 }
.dim { color: var(--muted) }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px }
.flip { font-weight: 700 }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 22px }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto }
.map { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.map svg { display: block; width: 100%; max-width: 760px; height: auto; margin: 0 auto; background: var(--bg); border-radius: 6px }
.map .leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); align-items: center }
.map circle { stroke: var(--panel); stroke-width: 1 }
.map circle.wt { fill: none; stroke: var(--muted); stroke-dasharray: 2 2 }
.ramp { display: inline-block; width: 120px; height: 10px; border-radius: 2px; vertical-align: middle }
.feed { display: flex; flex-direction: column; gap: 8px }
.fi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 4px 12px; align-items: baseline }
.fi.tg { border-left: 4px solid var(--accent) }
.fi .tm { font-family: var(--display); font-stretch: 80%; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums }
.fi .bd { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.fi .hd { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline }
.fi .hd b { font-size: 15px }
.fi .cs { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; font-variant-numeric: tabular-nums }
.fi .new { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--panel); background: var(--accent); border-radius: 4px; padding: 0 5px }
.feedctl { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px }
.targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px }
.targets .dial { border-color: var(--accent) }
.targets .dial .t a { text-decoration: none }
.chart svg { display: block; width: 100%; max-width: 780px; height: auto; min-width: 560px }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 28px; text-align: center; color: var(--muted) }
.seg-g { display: inline-flex }
button.seg { border-radius: 0; cursor: pointer; margin-left: -1px }
button.seg:first-child { border-radius: 6px 0 0 6px; margin-left: 0 } button.seg:last-child { border-radius: 0 6px 6px 0 }
button.seg.on { background: var(--ink); color: var(--panel); border-color: var(--ink) }
details.method { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px }
details.method summary { cursor: pointer; font-weight: 600 }
details.method p { max-width: 75ch; margin: 8px 0 0 }
@media (prefers-reduced-motion: no-preference) { .needle { transition: transform .6s cubic-bezier(.3,1.3,.5,1) } }
</style>

<header class="top"><div class="wrap">
  <h1><a href="#state" style="text-decoration:none">Vic Results Board</a></h1>
  <div class="controls">
    <label class="ctl">Go to <select id="jump" aria-label="Go to region or district"></select></label>
    <label class="ctl">Area <select id="area" aria-label="Area"></select></label>
    <label class="ctl">Focus party <select id="focus"></select></label>
    <span class="seg-g" role="group" aria-label="Swing method">
      <button class="seg" id="mode-sw" title="Compare what has been counted with the same booths and vote types in 2022">Like-for-like swing</button><button class="seg" id="mode-raw" title="Current share minus the final 2022 share">Vs 2022 final</button>
    </span>
  </div>
</div></header>
<div class="wrap">
  <div class="status" id="status">Loading results…</div>
  <main id="app"><div class="empty">Loading results…</div></main>
</div>

<script>
"use strict";
var M = null, ST = { focus: "socialists", mode: "sw", sort: {}, filter: {}, tables: {} };
try { var sv = JSON.parse(localStorage.getItem("vrb") || "{}"); if (sv.focus) ST.focus = sv.focus; if (sv.mode) ST.mode = sv.mode; if (sv.area) ST.area = sv.area; } catch (e) {}
function save() { try { localStorage.setItem("vrb", JSON.stringify({ focus: ST.focus, mode: ST.mode, area: ST.area || "" })); } catch (e) {} }
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function n0(v) { return v == null ? "–" : Math.round(v).toLocaleString("en-AU"); }
function p1(v) { return v == null || isNaN(v) ? "–" : v.toFixed(1); }
function sg(v) { return v == null || isNaN(v) ? "–" : (v > 0.049 ? "+" : v < -0.049 ? "−" : "±") + Math.abs(v).toFixed(1); }
function pct(a, b) { return b ? 100 * a / b : null; }
function aggKey(k) { return k && k.indexOf("ind:") === 0 ? "ind" : k; }
function pname(k) { var p = M.parties[k] || M.parties[aggKey(k)]; return p ? p[0] : (k || "–"); }
function pshort(k) { var p = M.parties[k] || M.parties[aggKey(k)]; if (p && p[1]) return p[1]; var n = pname(k); return n.length > 14 ? n.replace(/[^A-Z]/g, "").slice(0, 5) || n.slice(0, 12) : n; }
var KNOWN = { socialists: 1, labor: 1, liberal: 1, greens: 1, nationals: 1, oneNation: 1, ind: 1 };
function pcol(k) { k = aggKey(k); return "var(--p-" + (KNOWN[k] ? k : "other") + ")"; }
function chip(k, text) { return '<span class="chip" title="' + esc(pname(k)) + '"><i class="dot" style="background:' + pcol(k) + '"></i>' + esc(text == null ? pname(k) : text) + "</span>"; }
function surname(n) { return String(n || "").split(",")[0]; }
function swOf(o) { return o ? (ST.mode === "sw" ? o.sw : o.raw) : null; }
function swLabel() { return ST.mode === "sw" ? "like-for-like vs 2022" : "vs 2022 final"; }
function bar(v, max, k) { return v == null ? "" : '<span class="bar" style="width:' + Math.max(0, Math.min(100, 100 * v / (max || 100))) + '%;background:' + pcol(k) + '"></span>'; }
function swcell(v, k, R) {
  if (v == null) return '<span class="dim">–</span>';
  R = R || 10; var w = Math.min(50, 50 * Math.abs(v) / R);
  return '<span class="swc"><i style="background:' + pcol(k) + ";width:" + w + "%;" + (v >= 0 ? "left:50%" : "right:50%") + '"></i></span> <span class="num">' + sg(v) + "</span>";
}

/* ---------- dials ---------- */
function pt(t, r) { var a = Math.PI * t; return [100 - r * Math.cos(a), 100 - r * Math.sin(a)]; }
function arc(t0, t1, r) { var a = pt(t0, r), b = pt(t1, r); return "M" + a[0].toFixed(2) + " " + a[1].toFixed(2) + "A" + r + " " + r + " 0 0 " + (t1 >= t0 ? 1 : 0) + " " + b[0].toFixed(2) + " " + b[1].toFixed(2); }
function clamp(t) { return Math.max(0, Math.min(1, t)); }
function dialSvg(o) {
  // o: {segs:[{t0,t1,col}], ticks:[{t,label}], needle:t|null, value, unit, marks:[{t,title}]}
  var s = '<svg viewBox="0 0 200 150" role="img" aria-label="' + esc(o.aria || "") + '"><path d="' + arc(0, 1, 70) + '" fill="none" stroke="var(--track)" stroke-width="15"/>';
  (o.segs || []).forEach(function (g) { if (Math.abs(g.t1 - g.t0) > 0.002) s += '<path d="' + arc(g.t0, g.t1, 70) + '" fill="none" stroke="' + g.col + '" stroke-width="15"/>'; });
  (o.ticks || []).forEach(function (k) {
    var a = pt(k.t, 62), b = pt(k.t, 78), c = pt(k.t, 84);
    s += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" stroke="var(--panel)" stroke-width="1.5"/>';
    if (k.label != null) s += '<text class="gt" x="' + c[0].toFixed(1) + '" y="' + (c[1] + (k.t === 0 || k.t === 1 ? 13 : 3)).toFixed(1) + '" text-anchor="' + (k.t === 0 || k.t === 1 ? "middle" : k.t < 0.45 ? "end" : k.t > 0.55 ? "start" : "middle") + '">' + esc(k.label) + "</text>";
  });
  (o.marks || []).forEach(function (k) { var a = pt(k.t, 58), b = pt(k.t, 82); s += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2"><title>' + esc(k.title) + "</title></line>"; });
  if (o.needle != null) {
    var deg = 180 * clamp(o.needle) - 90;
    s += '<g class="needle" style="transform-origin:100px 100px;transform:rotate(' + deg.toFixed(1) + 'deg)"><path d="M97 100L100 40L103 100Z" fill="var(--ink)"/></g><circle cx="100" cy="100" r="6" fill="var(--ink)"/><circle cx="100" cy="100" r="2.5" fill="var(--panel)"/>';
  }
  s += '<text class="gv" x="100" y="133" text-anchor="middle">' + esc(o.value) + '</text><text class="gu" x="100" y="148" text-anchor="middle">' + esc(o.unit || "") + "</text></svg>";
  return s;
}
function dial(title, svg, sub) { return '<div class="dial"><div class="t">' + title + "</div>" + svg + '<div class="s">' + (sub || "") + "</div></div>"; }
function swingRange(vals) { var m = 0; vals.forEach(function (v) { if (v != null) m = Math.max(m, Math.abs(v)); }); var R = [5, 10, 20, 40, 80]; for (var i = 0; i < R.length; i++) if (m <= R[i]) return R[i]; return 100; }
function swingDial(k, v, R, title, sub) {
  var t = v == null ? null : clamp(0.5 + v / (2 * R));
  return dial(title || chip(k), dialSvg({
    aria: pname(k) + " swing " + sg(v) + " points", segs: v == null ? [] : [{ t0: 0.5, t1: t, col: pcol(k) }],
    ticks: [{ t: 0, label: "−" + R }, { t: 0.25, label: "−" + R / 2 }, { t: 0.5, label: "0" }, { t: 0.75, label: "+" + R / 2 }, { t: 1, label: "+" + R }],
    needle: t, value: sg(v), unit: v == null ? "no 2022 comparison yet" : "points swing"
  }), sub == null ? swLabel() : sub);
}
function countDial(o, title) {
  var v = pct(o.total, o.enrol), b = pct(o.bTotal, o.bEnrol);
  return dial(title || "Votes counted", dialSvg({
    aria: "Counted " + p1(v) + " percent of enrolment", segs: v == null ? [] : [{ t0: 0, t1: clamp(v / 100), col: "var(--count)" }],
    ticks: [{ t: 0, label: "0" }, { t: 0.25, label: "25" }, { t: 0.5, label: "50" }, { t: 0.75, label: "75" }, { t: 1, label: "100" }],
    marks: b ? [{ t: clamp(b / 100), title: "2022 final turnout " + p1(b) + "%" }] : [],
    needle: v == null ? 0 : v / 100, value: p1(v) + "%", unit: "of enrolment"
  }), (o.exp ? n0(o.in) + " of " + n0(o.exp) + " booths in" : n0(o.total) + " votes") + (b ? " · dashes: 2022 " + p1(b) + "%" : ""));
}
function tcpDial(tcp) {
  var a = tcp.c[0], b = tcp.c[1], t = clamp((a.p || 0) / 100), lead = a.v >= b.v ? a : b;
  return dial("Two-candidate preferred", dialSvg({
    aria: "Two candidate preferred " + pname(a.k) + " " + p1(a.p) + " " + pname(b.k) + " " + p1(b.p),
    segs: tcp.total ? [{ t0: 0, t1: Math.max(0, t - 0.006), col: pcol(a.k) }, { t0: Math.min(1, t + 0.006), t1: 1, col: pcol(b.k) }] : [],
    ticks: [{ t: 0, label: "" }, { t: 0.5, label: "50" }, { t: 1, label: "" }], needle: tcp.total ? t : null,
    value: tcp.total ? pshort(lead.k) + " " + p1(lead.p) : "–", unit: tcp.total ? "leads, 2CP %" : "no 2CP count yet"
  }), chip(a.k, pshort(a.k) + " " + p1(a.p)) + " &nbsp;v&nbsp; " + chip(b.k, pshort(b.k) + " " + p1(b.p)) + (tcp.same && swOf(lead) != null ? " · " + sg(swOf(lead)) + " to " + esc(pshort(lead.k)) : ""));
}
function quotaDial(row, positions) {
  var q = row ? row.q : null, max = Math.max(2, Math.ceil((q || 0) + 0.25)), ticks = [];
  for (var i = 0; i <= max * 2; i++) ticks.push({ t: i / (max * 2), label: i % 2 ? null : String(i / 2) });
  return dial(chip(row ? row.k : ST.focus) + " quotas", dialSvg({
    aria: "Quotas " + (q == null ? "none" : q.toFixed(2)), segs: q == null ? [] : [{ t0: 0, t1: clamp(q / max), col: pcol(row.k) }], ticks: ticks,
    marks: [{ t: 1 / max, title: "One quota elects one member" }], needle: q == null ? null : q / max, value: q == null ? "–" : q.toFixed(2), unit: "quotas, first preferences"
  }), positions + " seats · dashes: one quota");
}

/* ---------- tables ---------- */
function table(id, cols, rows, opt) {
  opt = opt || {}; ST.tables[id] = { cols: cols, rows: rows, opt: opt };
  if (!ST.sort[id] && opt.sort != null) ST.sort[id] = { c: opt.sort, d: opt.dir || -1 };
  return '<div class="tw" id="tw-' + id + '">' + tableInner(id) + "</div>";
}
function tableInner(id) {
  var T = ST.tables[id], cols = T.cols, rows = T.rows.slice(), so = ST.sort[id], f = (ST.filter[id] || "").toLowerCase();
  if (f && T.opt.text) rows = rows.filter(function (r) { return T.opt.text(r).toLowerCase().indexOf(f) >= 0; });
  if (so && cols[so.c] && cols[so.c].v) {
    var g = cols[so.c].v;
    rows.sort(function (a, b) {
      var x = g(a), y = g(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * so.d;
    });

  if (!M || M.meta.waiting || !M.state) { app.innerHTML = '<div class="empty"><h2>Waiting for the first results</h2><p>' + esc((M && M.meta.status) || "No feed yet. The count starts at 6 pm; this page checks again every minute.") + "</p></div>"; fillStatus(); return; }
  ST.tables = {};
  var r = route(), h, x;
  if (r.indexOf("d-") === 0 && (x = distById(r.slice(2)))) h = vDistrict(x);
  else if (r.indexOf("r-") === 0 && (x = regById(r.slice(2)))) h = vRegion(x);
  else if (r === "latest") h = vLatest(); else if (r === "regions") h = vRegions(); else if (r === "districts") h = vDistricts(); else if (r === "booths") h = vBooths(); else if (r === "method") h = vMethod(); else h = vState();
  var act = document.activeElement, aid = act && act.id, pos = aid && act.selectionStart;
  app.innerHTML = h;
  if (aid && $(aid) && aid.indexOf("f-") === 0) { $(aid).focus(); try { $(aid).setSelectionRange(pos, pos); } catch (e) {} }
  fillControls(); fillStatus();
}
function fillControls() {
  var ar = $("area"); ar.innerHTML = '<option value="">All Victoria</option>' + (M.areas || []).map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === ST.area ? " selected" : "") + ">" + esc(a.name) + "</option>"; }).join("");
  var f = $("focus"), ks = {}, opts;
  M.state.lower.rows.concat(M.state.upper.rows).forEach(function (r) { ks[r.k] = (ks[r.k] || 0) + r.v; });
  if (!ks[ST.focus]) ks[ST.focus] = 0;
  opts = Object.keys(ks).filter(function (k) { return k !== "ung" && M.parties[k]; }).sort(function (a, b) { return (KNOWN[b] ? 1 : 0) - (KNOWN[a] ? 1 : 0) || ks[b] - ks[a]; });
  f.innerHTML = opts.map(function (k) { return '<option value="' + esc(k) + '"' + (k === ST.focus ? " selected" : "") + ">" + esc(pname(k)) + "</option>"; }).join("");
  var j = $("jump"), r = route();
  j.innerHTML = '<option value="state">Victoria</option><optgroup label="Regions">' + M.regions.map(function (x) { return '<option value="r-' + x.id + '"' + (r === "r-" + x.id ? " selected" : "") + ">" + esc(x.name) + "</option>"; }).join("") + '</optgroup><optgroup label="Districts">' + M.districts.map(function (x) { return '<option value="d-' + x.id + '"' + (r === "d-" + x.id ? " selected" : "") + ">" + esc(x.name) + "</option>"; }).join("") + "</optgroup>";
  $("mode-sw").className = "seg" + (ST.mode === "sw" ? " on" : ""); $("mode-raw").className = "seg" + (ST.mode === "raw" ? " on" : "");
  $("mode-sw").setAttribute("aria-pressed", ST.mode === "sw"); $("mode-raw").setAttribute("aria-pressed", ST.mode === "raw");
}
var LIVE = { status: null, fetched: null, err: null };
function fillStatus() {
  var m = (M && M.meta) || {}, s = [];
  if (m.sample) s.push('<span class="pill warn">2022 sample data</span>');
  else if (m.event) s.push('<span class="pill">Live feed</span>');
  if (m.event) s.push(esc(m.event));
  if (m.created) s.push("VEC file made " + esc(String(m.created).replace("T", " ").slice(0, 16)));
  if (m.baseline) s.push("Swings vs " + esc(m.baseline) + " final");
  if (LIVE.fetched) s.push("Checked " + LIVE.fetched.toLocaleTimeString("en-AU"));
  if (LIVE.status || m.status) s.push(esc(LIVE.status || m.status));
  if (LIVE.err) s.push('<span class="pill warn">' + esc(LIVE.err) + "</span>");
  $("status").innerHTML = s.join(" · ") || "Loading results…";
}
$("area").addEventListener("change", function (e) { ST.area = e.target.value; ST.sort = {}; save(); render(); });
$("focus").addEventListener("change", function (e) { ST.focus = e.target.value; ST.sort = {}; save(); render(); });
$("jump").addEventListener("change", function (e) { location.hash = "#" + e.target.value; });
$("mode-sw").addEventListener("click", function () { ST.mode = "sw"; save(); render(); });
$("mode-raw").addEventListener("click", function () { ST.mode = "raw"; save(); render(); });
window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });
var lastGen = null;
function load() {
  fetch("data.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(function (d) {
    LIVE.fetched = new Date(); LIVE.err = null;
    var gen = d.meta && (d.meta.generated + "|" + JSON.stringify(d.meta.files || ""));
    if (gen !== lastGen) { lastGen = gen; M = d; render(); } else fillStatus();
  }).catch(function (e) { LIVE.err = "Could not load results (" + e.message + "). Trying again in a minute."; if (!M) $("app").innerHTML = '<div class="empty">' + esc(LIVE.err) + "</div>"; fillStatus(); });
  fetch("status.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (s) { if (s && s.status) { LIVE.status = s.status; fillStatus(); } }).catch(function () {});
}
load(); setInterval(load, 60000);
</script>
